name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node 24 ejecuta directamente las pruebas TypeScript con node:test
          # y satisface el mínimo declarado en package.json.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify SQL references and business rules
        run: npm run verificar

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        env:
          # Dummies solo para que `next build` no truene por falta de env vars.
          # Vercel inyecta los valores reales en el deploy; aquí no se usan
          # datos reales, solo se necesita que las variables existan.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-for-ci-build-only
        run: npm run build
